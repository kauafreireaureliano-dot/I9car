<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i9 CAR — Gerenciar Estoque</title><style>body{margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif;padding:30px;max-width:1000px;margin:auto}h1{font-size:38px}.sub{color:#9da4af}.box{background:#0d1016;border:1px solid #262b34;border-radius:18px;padding:22px;margin:20px 0}input,textarea,select{width:100%;background:#07090d;border:1px solid #2b313b;color:#fff;border-radius:10px;padding:13px;margin:7px 0 14px;box-sizing:border-box}textarea{min-height:90px}button{border:0;background:#ff6a19;color:#fff;padding:13px 18px;border-radius:10px;font-weight:bold;cursor:pointer}.secondary{background:#1b2029}.car{display:flex;justify-content:space-between;gap:15px;padding:15px;border-bottom:1px solid #252a33}.car small{color:#9da4af}.danger{background:#3b1616}.notice{font-size:13px;color:#ffb57e}.photos input{margin-bottom:5px}</style></head><body><h1>i<span style="color:#ff6a19">9</span> CAR — Estoque</h1><p class="sub">Cadastre os carros reais da loja. As alterações ficam salvas neste navegador nesta primeira versão.</p><div class="box"><div class="notice">Dica: para fotos, cole links diretos de imagem, como links do Imgur.</div><label>Título do veículo</label><input id="title" placeholder="Ex.: Toyota Corolla XEi 2.0"><label>Categoria</label><select id="category"><option>SUV</option><option>Sedã</option><option>Hatch</option><option>Picape</option><option>Outro</option></select><label>Preço</label><input id="price" placeholder="Ex.: R$ 89.900 ou CONSULTE"><label>Descrição</label><textarea id="description" placeholder="Legenda e informações do carro..."></textarea><label>Especificações (separadas por vírgula)</label><input id="specs" placeholder="2022, Automático, Flex, 45.000 km"><label>WhatsApp do vendedor (opcional)</label><input id="whatsapp" placeholder="5587991732345"><div class="photos"><label>Fotos do carro</label><input class="photo" placeholder="https://i.imgur.com/exemplo.jpg"><input class="photo" placeholder="https://i.imgur.com/exemplo2.jpg"><input class="photo" placeholder="https://i.imgur.com/exemplo3.jpg"><input class="photo" placeholder="https://i.imgur.com/exemplo4.jpg"></div><button onclick="saveCar()">SALVAR VEÍCULO</button></div><div class="box"><h2>Veículos cadastrados</h2><div id="list"></div></div><script>let editId=null;const key='i9car_inventory_v1';const fallback='5587991732345';function get(){return JSON.parse(localStorage.getItem(key)||'[]')}function set(x){localStorage.setItem(key,JSON.stringify(x))}function reset(){['title','price','description','specs','whatsapp'].forEach(id=>document.getElementById(id).value='');document.getElementById('category').value='SUV';document.querySelectorAll('.photo').forEach(x=>x.value='');editId=null}function saveCar(){const imgs=[...document.querySelectorAll('.photo')].map(x=>x.value.trim()).filter(Boolean);const c={id:editId||Date.now(),title:title.value.trim(),category:category.value,price:price.value.trim(),description:description.value.trim(),specs:specs.value.split(',').map(x=>x.trim()).filter(Boolean),whatsapp:whatsapp.value.replace(/\D/g,'')||fallback,images:imgs};if(!c.title||!c.price||!imgs.length)return alert('Preencha título, preço e pelo menos uma foto.');let all=get();if(editId)all=all.map(x=>x.id===editId?c:x);else all.unshift(c);set(all);reset();render();alert('Veículo salvo! Abra o site principal neste mesmo navegador para visualizar.')}function del(id){if(confirm('Excluir este veículo?')){set(get().filter(x=>x.id!==id));render()}}function edit(id){const c=get().find(x=>x.id===id);editId=c.id;title.value=c.title;category.value=c.category;price.value=c.price;description.value=c.description;specs.value=c.specs.join(', ');whatsapp.value=c.whatsapp;document.querySelectorAll('.photo').forEach((x,i)=>x.value=c.images[i]||'');scrollTo({top:0,behavior:'smooth'})}function render(){const all=get();list.innerHTML=all.length?all.map(c=>`<div class="car"><div><b>${c.title}</b><br><small>${c.category} • ${c.price} • ${c.images.length} foto(s)</small></div><div><button class="secondary" onclick="edit(${c.id})">EDITAR</button> <button class="danger" onclick="del(${c.id})">EXCLUIR</button></div></div>`).join(''):'<p class="sub">Nenhum veículo cadastrado ainda.</p>'}render();</script></body></html>
