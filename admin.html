<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i9 CAR — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase.js"></script><style>:root{--o:#ff6a19;--bg:#07090d;--p:#0d1016;--l:#252b35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px Arial,sans-serif}.login,.app{max-width:1050px;margin:auto;padding:35px}.brand{font-size:42px;font-weight:900}.brand b{color:var(--o)}.box{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:24px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:12px;color:#a9b0ba;margin:8px 0}input,textarea,select{width:100%;padding:14px;background:#07090d;color:#fff;border:1px solid var(--l);border-radius:10px}textarea{min-height:100px}button{border:0;background:var(--o);color:#fff;font-weight:800;padding:13px 18px;border-radius:10px;cursor:pointer}.dark{background:#1a202a}.danger{background:#481919}.car{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--l);padding:15px 0;gap:15px}.muted{color:#9ba3ae}.hide{display:none}.status{font-size:13px;color:#ffb176}a{text-decoration:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.login,.app{padding:18px}.car{align-items:flex-start;flex-direction:column}}</style></head><body><div id="login" class="login"><div class="brand">i<b>9</b> ADMIN</div><div class="box"><h2>Entrar no painel</h2><p class="muted">Use o e-mail e senha criados no Supabase.</p><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="password" type="password"><br><br><button onclick="signIn()">ENTRAR →</button><p id="loginStatus" class="status"></p></div></div><main id="app" class="app hide"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div class="brand">i<b>9</b> ADMIN</div><div class="muted">Gerencie o estoque da loja</div></div><div><a href="/crm.html"><button class="dark">CRM</button></a> <button class="dark" onclick="signOut()">SAIR</button></div></div><div class="box"><h2 id="formTitle">Adicionar veículo</h2><div class="grid"><div><label>Título</label><input id="title" placeholder="Ex.: Toyota Corolla XEi 2.0"><label>Categoria</label><select id="category"><option>SUV</option><option>Sedã</option><option>Hatch</option><option>Picape</option><option>Outro</option></select><label>Preço</label><input id="price" placeholder="R$ 89.900"><label>WhatsApp do vendedor</label><input id="whatsapp" placeholder="5587991732345"></div><div><label>Descrição / legenda</label><textarea id="description" placeholder="Informações do veículo..."></textarea><label>Especificações</label><input id="specs" placeholder="2022, Automático, Flex, 45.000 km"><label>Fotos — uma URL por linha</label><textarea id="images" placeholder="https://i.imgur.com/foto1.jpg&#10;https://i.imgur.com/foto2.jpg"></textarea></div></div><br><button onclick="saveVehicle()">SALVAR VEÍCULO</button> <button class="dark" onclick="resetForm()">LIMPAR</button><p id="status" class="status"></p></div><div class="box"><h2>Estoque cadastrado</h2><div id="list" class="muted">Carregando...</div></div></main><script>const ok=window.I9_SUPABASE_URL&&!window.I9_SUPABASE_URL.includes('COLE_AQUI');const sb=ok?supabase.createClient(window.I9_SUPABASE_URL,window.I9_SUPABASE_ANON_KEY):null;let editing=null;function cfg(){return 'Supabase ainda não configurado. Preencha supabase.js com a URL e a anon key.'}async function signIn(){if(!sb)return loginStatus.textContent=cfg();loginStatus.textContent='Entrando...';const{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});loginStatus.textContent=error?error.message:''}async function signOut(){await sb.auth.signOut();location.reload()}async function boot(){if(!sb){loginStatus.textContent=cfg();return}const{data:{session}}=await sb.auth.getSession();if(session){login.classList.add('hide');app.classList.remove('hide');load()}else{login.classList.remove('hide');app.classList.add('hide')}}async function load(){const{data,error}=await sb.from('vehicles').select('*').order('created_at',{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=data.length?data.map(c=>`<div class="car"><div><b>${c.title}</b><br><small>${c.category} • ${c.price} • ${(c.images||[]).length} foto(s)</small></div><div><button class="dark" onclick="editVehicle('${c.id}')">EDITAR</button> <button class="danger" onclick="deleteVehicle('${c.id}')">EXCLUIR</button></div></div>`).join(''):'Nenhum veículo cadastrado.';window.inventory=data}function resetForm(){editing=null;formTitle.textContent='Adicionar veículo';['title','price','whatsapp','description','specs','images'].forEach(x=>window[x].value='');category.value='SUV'}async function saveVehicle(){if(!sb)return status.textContent=cfg();const payload={title:title.value.trim(),category:category.value,price:price.value.trim(),description:description.value.trim(),specs:specs.value.split(',').map(x=>x.trim()).filter(Boolean),images:images.value.split('\n').map(x=>x.trim()).filter(Boolean),whatsapp:whatsapp.value.replace(/\D/g,'')||'5587991732345'};if(!payload.title||!payload.price||!payload.images.length)return status.textContent='Preencha título, preço e pelo menos uma foto.';status.textContent='Salvando...';const q=editing?sb.from('vehicles').update(payload).eq('id',editing):sb.from('vehicles').insert(payload);const{error}=await q;if(error){status.textContent=error.message;return}status.textContent='Veículo salvo com sucesso!';resetForm();load()}function editVehicle(id){const c=window.inventory.find(x=>x.id===id);editing=id;formTitle.textContent='Editar veículo';title.value=c.title;category.value=c.category;price.value=c.price;whatsapp.value=c.whatsapp||'';description.value=c.description||'';specs.value=(c.specs||[]).join(', ');images.value=(c.images||[]).join('\n');scrollTo({top:0,behavior:'smooth'})}async function deleteVehicle(id){if(confirm('Excluir este veículo?')){const{error}=await sb.from('vehicles').delete().eq('id',id);if(error)alert(error.message);load()}}boot();</script></body></html>
