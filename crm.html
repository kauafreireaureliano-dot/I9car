<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i9 CRM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase.js"></script><style>body{margin:0;background:#080a0f;color:#fff;font:15px Arial}*{box-sizing:border-box}.wrap{max-width:1200px;margin:auto;padding:25px}.hide{display:none!important}.brand{font-size:32px;font-weight:900}.brand b,.orange{color:#ff6a19}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.nav{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}button{background:#1a202a;color:#fff;border:1px solid #303846;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer}.primary{background:#ff6a19;border-color:#ff6a19}.box,.card{background:#10141c;border:1px solid #29303b;border-radius:16px;padding:18px;margin:15px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card strong{display:block;font-size:28px;margin-top:8px}input,textarea,select{width:100%;background:#080b10;color:#fff;border:1px solid #303846;border-radius:9px;padding:12px;margin:5px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.item{padding:14px;border-bottom:1px solid #29303b}.modal{position:fixed;inset:0;background:#000b;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}.modalCard{background:#10141c;border:1px solid #303846;border-radius:18px;padding:22px;width:min(760px,100%);max-height:90vh;overflow:auto}@media(max-width:700px){.stats,.grid{grid-template-columns:1fr}}</style><body><section id="login" class="wrap"><div class="brand">i<b>9</b> CRM</div><div class="box"><h2>Entrar</h2><input id="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="enter" class="primary">ENTRAR</button><p id="msg"></p></div></section><main id="app" class="wrap hide"><div class="top"><div><div class="brand">i<b>9</b> CRM</div><span>Leads, oportunidades e resultados.</span></div><button id="logout">SAIR</button></div><div class="nav"><button id="dash" class="primary">VISÃO GERAL</button><button id="new">+ NOVO LEAD</button></div><div class="stats"><div class="card">Leads<strong id="total">0</strong></div><div class="card">Qualificados<strong id="qual">0</strong></div><div class="card">Avaliações<strong id="eval">0</strong></div><div class="card">Comprados<strong id="buy">0</strong></div><div class="card">Vendidos<strong id="sold">0</strong></div></div><div class="box"><h2>Últimas oportunidades</h2><div id="list"></div></div></main><div id="modal" class="modal hide"><div class="modalCard"><div class="top"><h2 id="title">Novo lead</h2><button id="x" type="button">✕</button></div><div class="grid"><div><label>Nome</label><input id="name"><label>Telefone</label><input id="phone"><label>Veículo</label><input id="vehicle"><label>Valor desejado</label><input id="value"></div><div><label>Origem</label><select id="source"><option>Meta Ads</option><option>Instagram Orgânico</option><option>Indicação</option><option>Outro</option></select><label>Campanha</label><input id="campaign"><label>Criativo</label><input id="creative"><label>Qualidade</label><select id="quality"><option value="quente">Quente</option><option value="morno">Morno</option><option value="frio">Frio</option></select></div></div><label>Status</label><select id="status"><option value="novo">Novo</option><option value="contato">Em contato</option><option value="qualificado">Qualificado</option><option value="avaliacao">Avaliação</option><option value="proposta">Proposta</option><option value="negociacao">Negociação</option><option value="comprado">Comprado</option><option value="perdido">Perdido</option></select><label>Observações</label><textarea id="notes"></textarea><div class="row"><button id="save" class="primary">SALVAR LEAD</button><button id="del" class="hide">EXCLUIR</button></div></div></div><script>const $=x=>document.getElementById(x),sb=supabase.createClient(I9_SUPABASE_URL,I9_SUPABASE_ANON_KEY);let leads=[],edit=null;function close(){modal.classList.add('hide');document.body.style.overflow='';edit=null}function open(x=null){edit=x?.id||null;modal.classList.remove('hide');document.body.style.overflow='hidden';['name','phone','vehicle','value','campaign','creative','notes'].forEach(k=>$(k).value=x?.[k==='value'?'vehicle_value':k]||'');source.value=x?.source||'Meta Ads';quality.value=x?.quality||'quente';status.value=x?.status||'novo';del.classList.toggle('hide',!x)}async function load(){let{data,error}=await sb.from('crm_leads').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);leads=data||[];total.textContent=leads.length;qual.textContent=leads.filter(x=>['qualificado','avaliacao','proposta','negociacao','comprado'].includes(x.status)).length;eval.textContent=leads.filter(x=>x.status==='avaliacao').length;buy.textContent=leads.filter(x=>x.status==='comprado').length;sold.textContent=0;list.innerHTML=leads.map(x=>`<div class="item"><b>${x.name||'Sem nome'}</b> — ${x.vehicle||'Sem veículo'} — ${x.status}<br><button class="edit" data-id="${x.id}">EDITAR</button></div>`).join('')||'Nenhum lead cadastrado.';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>open(leads.find(x=>x.id===b.dataset.id)))}enter.onclick=async()=>{let{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.textContent=error.message;else boot()};logout.onclick=async()=>{await sb.auth.signOut();location.reload()};new.onclick=()=>open();x.onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.onkeydown=e=>{if(e.key==='Escape')close()};save.onclick=async()=>{let p={name:name.value.trim(),phone:phone.value.trim(),vehicle:vehicle.value.trim(),vehicle_value:value.value.trim(),source:source.value,campaign:campaign.value.trim(),creative:creative.value.trim(),quality:quality.value,status:status.value,notes:notes.value.trim()};if(!p.name)return alert('Informe o nome');let q=edit?sb.from('crm_leads').update(p).eq('id',edit):sb.from('crm_leads').insert(p);let{error}=await q;if(error)return alert(error.message);close();load()};del.onclick=async()=>{if(edit&&confirm('Excluir este lead?')){await sb.from('crm_leads').delete().eq('id',edit);close();load()}};async function boot(){let{data:{session}}=await sb.auth.getSession();if(!session)return;login.classList.add('hide');app.classList.remove('hide');load()}boot()</script></body></html>
