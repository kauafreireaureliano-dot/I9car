<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i9 CRM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase.js"></script><style>body{margin:0;background:#080a0f;color:#fff;font-family:Arial,sans-serif}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.card{width:min(420px,90%);padding:34px;border:1px solid #303542;border-radius:24px;background:#11141c}.logo{font-size:36px;font-weight:900}.logo b{color:#ff6a19}input,select,textarea{box-sizing:border-box;width:100%;padding:14px;margin:7px 0 14px;background:#090b10;color:#fff;border:1px solid #303542;border-radius:10px}button{padding:13px 17px;border:0;border-radius:10px;background:#222936;color:#fff;font-weight:bold;cursor:pointer}.primary{background:#ff6a19}.app{padding:28px;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.stats,.board{display:grid;gap:14px}.stats{grid-template-columns:repeat(5,1fr);margin:22px 0}.stat,.column,.lead{background:#11141c;border:1px solid #292f3a;border-radius:16px;padding:18px}.stat span,small,p{color:#929aaa}.stat strong{display:block;font-size:30px;margin-top:8px}.board{grid-template-columns:repeat(7,minmax(200px,1fr));overflow:auto}.column{min-height:380px;padding:10px}.lead{padding:12px;margin:8px 0;cursor:pointer}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px}.modal .card{max-height:90vh;overflow:auto;width:min(760px,100%)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.app{padding:16px}}</style></head><body><section id="loginView" class="login"><div class="card"><div class="logo">i<b>9</b> CRM</div><h1>Central comercial</h1><p>Entre com o mesmo e-mail e senha do Admin.</p><input id="emailInput" type="email" placeholder="E-mail"><input id="passwordInput" type="password" placeholder="Senha"><button id="loginBtn" class="primary" style="width:100%">ENTRAR NO CRM</button><p id="loginMsg"></p></div></section><main id="appView" class="app hide"><div class="top"><div><div class="logo">i<b>9</b> CRM</div><h1>Resultados e oportunidades</h1></div><div><button id="addBtn" class="primary">＋ NOVA OPORTUNIDADE</button> <button id="logoutBtn">SAIR</button></div></div><div class="stats"><div class="stat"><span>OPORTUNIDADES</span><strong id="total">0</strong></div><div class="stat"><span>QUALIFICADOS</span><strong id="qualified">0</strong></div><div class="stat"><span>AVALIAÇÕES</span><strong id="evaluations">0</strong></div><div class="stat"><span>COMPRADOS</span><strong id="bought">0</strong></div><div class="stat"><span>CONVERSÃO</span><strong id="conversion">0%</strong></div></div><h2>Pipeline</h2><div id="board" class="board"></div></main><div id="modal" class="modal hide"><div class="card"><div class="top"><h2 id="formTitle">Nova oportunidade</h2><button id="closeBtn">✕</button></div><div class="grid"><div><input id="leadName" placeholder="Nome do cliente"><input id="leadPhone" placeholder="Telefone"><input id="leadVehicle" placeholder="Veículo"><input id="leadValue" placeholder="Valor desejado"></div><div><select id="leadSource"><option>Meta Ads</option><option>Instagram Orgânico</option><option>Indicação</option><option>Outro</option></select><input id="leadCampaign" placeholder="Campanha"><input id="leadCreative" placeholder="Criativo"><select id="leadQuality"><option value="quente">🔥 Quente</option><option value="morno">🟡 Morno</option><option value="frio">❄️ Frio</option></select></div></div><select id="leadStatus"><option value="novo">Novo lead</option><option value="contato">Em contato</option><option value="qualificado">Qualificado</option><option value="avaliacao">Avaliação</option><option value="proposta">Proposta</option><option value="negociacao">Negociação</option><option value="comprado">Comprado</option><option value="perdido">Perdido</option></select><textarea id="leadNotes" placeholder="Observações"></textarea><button id="saveBtn" class="primary">SALVAR</button> <button id="deleteBtn" class="hide">EXCLUIR</button></div></div><script>const sb=supabase.createClient(window.I9_SUPABASE_URL,window.I9_SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);let leads=[],editingId=null;const stages=[['novo','NOVOS'],['contato','EM CONTATO'],['qualificado','QUALIFICADOS'],['avaliacao','AVALIAÇÕES'],['proposta','PROPOSTAS'],['negociacao','NEGOCIAÇÃO'],['comprado','COMPRADOS']];function showApp(){ $('loginView').classList.add('hide');$('appView').classList.remove('hide');loadLeads()}function showLogin(){ $('appView').classList.add('hide');$('loginView').classList.remove('hide')}async function login(){const email=$('emailInput').value.trim(),password=$('passwordInput').value;if(!email||!password){$('loginMsg').textContent='Preencha e-mail e senha.';return}$('loginMsg').textContent='Entrando...';const {error}=await sb.auth.signInWithPassword({email,password});if(error){$('loginMsg').textContent='Erro: '+error.message;return}showApp()}$('loginBtn').onclick=login;$('passwordInput').onkeydown=e=>{if(e.key==='Enter')login()};$('logoutBtn').onclick=async()=>{await sb.auth.signOut();showLogin()};function openModal(item){editingId=item?.id||null;$('formTitle').textContent=item?'Editar oportunidade':'Nova oportunidade';['leadName','leadPhone','leadVehicle','leadCampaign','leadCreative','leadNotes'].forEach(id=>$(id).value='');$('leadValue').value='';if(item){$('leadName').value=item.name||'';$('leadPhone').value=item.phone||'';$('leadVehicle').value=item.vehicle||'';$('leadValue').value=item.vehicle_value||'';$('leadSource').value=item.source||'Meta Ads';$('leadCampaign').value=item.campaign||'';$('leadCreative').value=item.creative||'';$('leadQuality').value=item.quality||'quente';$('leadStatus').value=item.status||'novo';$('leadNotes').value=item.notes||''}$('deleteBtn').classList.toggle('hide',!item);$('modal').classList.remove('hide')}function closeModal(){$('modal').classList.add('hide');editingId=null}$('addBtn').onclick=()=>openModal();$('closeBtn').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};async function loadLeads(){const {data,error}=await sb.from('crm_leads').select('*').order('created_at',{ascending:false});if(error){alert('Erro ao carregar CRM: '+error.message);return}leads=data||[];const count=s=>leads.filter(x=>x.status===s).length;$('total').textContent=leads.length;$('qualified').textContent=leads.filter(x=>['qualificado','avaliacao','proposta','negociacao','comprado'].includes(x.status)).length;$('evaluations').textContent=count('avaliacao');$('bought').textContent=count('comprado');$('conversion').textContent=leads.length?Math.round(count('comprado')*100/leads.length)+'%':'0%';$('board').innerHTML=stages.map(([id,label])=>{const items=leads.filter(x=>x.status===id);return `<section class="column"><b>${label} (${items.length})</b>${items.map(x=>`<article class="lead" data-id="${x.id}"><strong>${x.name||'Sem nome'}</strong><br><small>🚗 ${x.vehicle||'Não informado'}</small><br><small>📢 ${x.source||'—'}</small></article>`).join('')||'<p>Sem oportunidades</p>'}</section>`}).join('');document.querySelectorAll('.lead').forEach(el=>el.onclick=()=>openModal(leads.find(x=>x.id===el.dataset.id)))}$('saveBtn').onclick=async()=>{const payload={name:$('leadName').value.trim(),phone:$('leadPhone').value.trim(),vehicle:$('leadVehicle').value.trim(),vehicle_value:$('leadValue').value.trim(),source:$('leadSource').value,campaign:$('leadCampaign').value.trim(),creative:$('leadCreative').value.trim(),quality:$('leadQuality').value,status:$('leadStatus').value,notes:$('leadNotes').value.trim()};if(!payload.name)return alert('Informe o nome do cliente');const q=editingId?sb.from('crm_leads').update(payload).eq('id',editingId):sb.from('crm_leads').insert(payload);const {error}=await q;if(error){alert('Erro ao salvar: '+error.message);return}closeModal();loadLeads()};$('deleteBtn').onclick=async()=>{if(editingId&&confirm('Excluir oportunidade?')){const {error}=await sb.from('crm_leads').delete().eq('id',editingId);if(error)return alert(error.message);closeModal();loadLeads()}};sb.auth.getSession().then(({data:{session}})=>{if(session)showApp()});</script></body></html>
