<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i9 CRM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase.js"></script><style>body{margin:0;background:#080a0f;color:#fff;font:15px Arial}*{box-sizing:border-box}.wrap{max-width:1200px;margin:auto;padding:25px}.hide{display:none!important}.brand{font-size:32px;font-weight:900}.brand b,.orange{color:#ff6a19}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.nav{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}button{background:#1a202a;color:#fff;border:1px solid #303846;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer}.primary{background:#ff6a19;border-color:#ff6a19}.box,.card{background:#10141c;border:1px solid #29303b;border-radius:16px;padding:18px;margin:15px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card strong{display:block;font-size:28px;margin-top:8px}input,textarea,select{width:100%;background:#080b10;color:#fff;border:1px solid #303846;border-radius:9px;padding:12px;margin:5px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.item{padding:14px;border-bottom:1px solid #29303b}.modal{position:fixed;inset:0;background:#000b;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}.modalCard{background:#10141c;border:1px solid #303846;border-radius:18px;padding:22px;width:min(760px,100%);max-height:90vh;overflow:auto}.err{color:#ff9a9a;min-height:22px}@media(max-width:700px){.stats,.grid{grid-template-columns:1fr}}</style><body><section id="login" class="wrap"><div class="brand">i<b>9</b> CRM</div><div class="box"><h2>Entrar</h2><p>Use exatamente o mesmo e-mail e senha da área Admin.</p><input id="email" type="email" autocomplete="username" placeholder="E-mail"><input id="password" type="password" autocomplete="current-password" placeholder="Senha"><button id="enter" type="button" class="primary">ENTRAR</button><p id="msg" class="err"></p></div></section><main id="app" class="wrap hide"><div class="top"><div><div class="brand">i<b>9</b> CRM</div><span>Leads, oportunidades e resultados.</span></div><button id="logout">SAIR</button></div><div class="nav"><button id="dash" class="primary">VISÃO GERAL</button><button id="new">+ NOVO LEAD</button></div><div class="stats"><div class="card">Leads<strong id="total">0</strong></div><div class="card">Qualificados<strong id="qual">0</strong></div><div class="card">Avaliações<strong id="eval">0</strong></div><div class="card">Comprados<strong id="buy">0</strong></div><div class="card">Vendidos<strong id="sold">0</strong></div></div><div class="box"><h2>Últimas oportunidades</h2><div id="list"></div></div></main><div id="modal" class="modal hide"><div class="modalCard"><div class="top"><h2>Novo lead</h2><button id="x" type="button">✕</button></div><div class="grid"><div><label>Nome</label><input id="name"><label>Telefone</label><input id="phone"><label>Veículo</label><input id="vehicle"><label>Valor desejado</label><input id="value"></div><div><label>Origem</label><select id="source"><option>Meta Ads</option><option>Instagram Orgânico</option><option>Indicação</option><option>Outro</option></select><label>Campanha</label><input id="campaign"><label>Criativo</label><input id="creative"><label>Qualidade</label><select id="quality"><option value="quente">Quente</option><option value="morno">Morno</option><option value="frio">Frio</option></select></div></div><label>Status</label><select id="status"><option value="novo">Novo</option><option value="contato">Em contato</option><option value="qualificado">Qualificado</option><option value="avaliacao">Avaliação</option><option value="proposta">Proposta</option><option value="negociacao">Negociação</option><option value="comprado">Comprado</option><option value="perdido">Perdido</option></select><label>Observações</label><textarea id="notes"></textarea><div class="row"><button id="save" class="primary">SALVAR LEAD</button><button id="del" class="hide">EXCLUIR</button></div></div></div><script>const $=id=>document.getElementById(id);const sb=supabase.createClient(window.I9_SUPABASE_URL,window.I9_SUPABASE_ANON_KEY);let leads=[],edit=null;function close(){$('modal').classList.add('hide');document.body.style.overflow='';edit=null}function openLead(v=null){edit=v?.id||null;$('modal').classList.remove('hide');document.body.style.overflow='hidden';['name','phone','vehicle','value','campaign','creative','notes'].forEach(k=>$(k).value=v?.[k==='value'?'vehicle_value':k]||'');$('source').value=v?.source||'Meta Ads';$('quality').value=v?.quality||'quente';$('status').value=v?.status||'novo';$('del').classList.toggle('hide',!v)}async function load(){const{data,error}=await sb.from('crm_leads').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);leads=data||[];$('total').textContent=leads.length;$('qual').textContent=leads.filter(v=>['qualificado','avaliacao','proposta','negociacao','comprado'].includes(v.status)).length;$('eval').textContent=leads.filter(v=>v.status==='avaliacao').length;$('buy').textContent=leads.filter(v=>v.status==='comprado').length;$('list').innerHTML=leads.map(v=>`<div class="item"><b>${v.name||'Sem nome'}</b> — ${v.vehicle||'Sem veículo'} — ${v.status}<br><button class="edit" data-id="${v.id}">EDITAR</button></div>`).join('')||'Nenhum lead cadastrado.';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openLead(leads.find(v=>v.id===b.dataset.id)))}async function loginNow(){const e=$('email').value.trim(),p=$('password').value;if(!e||!p){$('msg').textContent='Digite seu e-mail e senha.';return}$('msg').textContent='Entrando...';const{error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){$('msg').textContent=error.message;return}$('msg').textContent='';await boot()}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){$('login').classList.remove('hide');$('app').classList.add('hide');return}$('login').classList.add('hide');$('app').classList.remove('hide');load()}$('enter').addEventListener('click',loginNow);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')loginNow()});$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('new').onclick=()=>openLead();$('x').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};document.onkeydown=e=>{if(e.key==='Escape')close()};$('save').onclick=async()=>{const p={name:$('name').value.trim(),phone:$('phone').value.trim(),vehicle:$('vehicle').value.trim(),vehicle_value:$('value').value.trim(),source:$('source').value,campaign:$('campaign').value.trim(),creative:$('creative').value.trim(),quality:$('quality').value,status:$('status').value,notes:$('notes').value.trim()};if(!p.name)return alert('Informe o nome');const q=edit?sb.from('crm_leads').update(p).eq('id',edit):sb.from('crm_leads').insert(p);const{error}=await q;if(error)return alert(error.message);close();load()};$('del').onclick=async()=>{if(edit&&confirm('Excluir este lead?')){await sb.from('crm_leads').delete().eq('id',edit);close();load()}};boot()</script></body></html>
